site_name: Modelagem quantitativa — acesso restrito
site_description: Relatório agregado do Artefato 3
docs_dir: .build/private-docs
site_dir: public

theme:
  name: material
  language: pt-BR

nav:
  - Início: index.md
  - Modelagem quantitativa: modelagem_quantitativa_de_dados_do_parceiro.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax-init.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
